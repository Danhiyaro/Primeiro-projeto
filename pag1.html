    <button type="button" commandfor="confirmacao" command="show-modal">

    </button>

    <dialog id="confirmacao">

        <h2>Confirmação</h2>

        <p>
            Você deseja realmente reproduzir este áudio?
        </p>

        <button type="button" commandfor="confirmacao" command="close">
            Cancelar
        </button>

        <button type="button" commandfor="confirmacao" command="close">
            Sim, quero reproduzir
        </button>

    </dialog>
